                var savedName = localStorage.getItem(STORAGE_KEY);
                if (savedName) {
                    nameInput.value = savedName;
                } else {
                    nameInput.value = '';
                }

                // 生成血色粒子
                var existing = nameBox.querySelectorAll('.blood-particle');
                existing.forEach(function(p) { p.remove(); });
                for (var i = 0; i < 12; i++) {
                    var p = document.createElement('span');
                    p.className = 'blood-particle';
                    p.style.left = (5 + Math.random() * 90) + '%';
                    p.style.top = (5 + Math.random() * 80) + '%';
                    p.style.animationDuration = (2 + Math.random() * 2) + 's';
                    p.style.animationDelay = (Math.random() * 1.5) + 's';
                    p.style.width = (2 + Math.random() * 5) + 'px';
                    p.style.height = p.style.width;
                    nameBox.appendChild(p);
                }

                // 显示弹窗
                nameOverlay.classList.add('active');

                // 聚焦输入框并选中全部文字，方便直接回车确认
                setTimeout(function() {
                    nameInput.focus();
                    nameInput.select();
                }, 400);

                specialNameAttempted = false;
                console.log('✅ 名字注册弹窗已显示（增强动画版）');
            }

            // 兜底触发（如果消散后弹窗未显示）
            setTimeout(function() {
                if (!nameModalShown && isDispersing) {
                    console.warn('⚠️ 兜底触发：强制显示名字注册弹窗');
                    showNameInputForce();
                }
            }, 12000);

            // ============================================================
            // ★ ★ ★ 名字确认逻辑（带退出动画） ★ ★ ★
            // ============================================================
            function handleNameConfirm() {
                if (isExitingNameModal) return;
                var name = nameInput.value.trim();
                if (!name) {
                    nameError.textContent = '请输入一个名字';
                    nameError.classList.add('show');
                    return;
                }

                // ★ 检测保留名字
                if (RESERVED_NAMES.indexOf(name) !== -1) {
                    if (!specialNameAttempted) {
                        nameError.textContent = '名字已被注册';
                        nameError.classList.add('show');
                        specialNameAttempted = true;
                        nameInput.style.borderColor = 'rgba(200, 80, 80, 0.6)';
                        setTimeout(function() {
                            nameInput.style.borderColor = '';
                        }, 600);
                        return;
                    } else {
                        nameError.classList.remove('show');
                        // 特殊名字第二次确认后直接跳转轮回一
                        doNameExit('blood');
                        setTimeout(function() {
                            pageTransition.classList.add('active');
                            setTimeout(function() {
                                window.location.href = '轮回一.html';
                            }, 600);
                        }, 500);
                        return;
                    }
                }

                // 普通名字：保存并登录
                nameError.classList.remove('show');
                localStorage.setItem(STORAGE_KEY, name);
                localStorage.setItem(LOGIN_KEY, 'true');

                // 触发退出动画
                doNameExit('blood');
                setTimeout(function() {
                    pageTransition.classList.add('active');
                    setTimeout(function() {
                        window.location.href = '大厅.html';
                    }, 600);
                }, 500);
            }

            // ============================================================
            // ★ ★ ★ 名字取消逻辑（带碎裂退出动画） ★ ★ ★
            // ============================================================
            function handleNameCancel() {
                if (isExitingNameModal) return;
                doNameExit('shatter');
                setTimeout(function() {
                    location.reload();
                }, 900);
            }

            // ============================================================
            // ★ ★ ★ 执行退出动画 ★ ★ ★
            // ============================================================
            function doNameExit(type) {
                if (isExitingNameModal) return;
                isExitingNameModal = true;

                // 禁用按钮
                nameConfirm.disabled = true;
                nameCancel.disabled = true;

                if (type === 'shatter') {
                    // 碎裂消散
                    nameBox.classList.add('shatter');
                    var children = nameBox.querySelectorAll('.name-title, .name-sub, .name-input-wrap, .name-actions, .name-error');
                    children.forEach(function(el) {
                        var sx = (Math.random() - 0.5) * 120;
                        var sy = -30 - Math.random() * 80;
                        var rot = (Math.random() - 0.5) * 60;
                        el.style.setProperty('--sx', sx + 'px');
                        el.style.setProperty('--sy', sy + 'px');
                        el.style.setProperty('--rot', rot + 'deg');
                    });
                    setTimeout(function() {
                        nameOverlay.classList.add('exiting');
                    }, 300);
                } else {
                    // 血色消散
                    nameBox.classList.add('blood-exit');
                    setTimeout(function() {
                        nameOverlay.classList.add('exiting');
                    }, 300);
                }

                // 清理血色粒子
                setTimeout(function() {
                    var particles = nameBox.querySelectorAll('.blood-particle');
                    particles.forEach(function(p) { p.remove(); });
                }, 400);

                // 重置状态（延迟）
                setTimeout(function() {
                    nameBox.classList.remove('shatter', 'blood-exit');
                    nameConfirm.disabled = false;
                    nameCancel.disabled = false;
                    isExitingNameModal = false;
                }, 1200);
            }

            // ============================================================
            // ★ 事件绑定
            // ============================================================
            nameConfirm.addEventListener('click', handleNameConfirm);
            nameCancel.addEventListener('click', handleNameCancel);
            nameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleNameConfirm();
                }
                if (e.key === 'Escape') {
                    handleNameCancel();
                }
                if (nameError.classList.contains('show') && nameError.textContent !== '名字已被注册') {
                    nameError.classList.remove('show');
                }
            });
            nameInput.addEventListener('input', function() {
                if (nameError.classList.contains('show') && nameError.textContent !== '名字已被注册') {
                    nameError.classList.remove('show');
                }
                if (specialNameAttempted) {
                    specialNameAttempted = false;
                }
            });

            // ============================================================
            // 闲置计时 & 停留时间
            // ============================================================
            setInterval(function() {
                if (titleActive) {
                    idleTime++;
                    menuStaySeconds++;
                }
            }, 1000);

            // ============================================================
            // 底部提示随停留时间变化
            // ============================================================
            function updateHintByStay() {
                if (!titleActive || isDispersing) return;
                var sec = menuStaySeconds;
                var currentText = ORIGIN_HINT;
                for (var i = 0; i < HINT_PHASES.length; i++) {
                    var phase = HINT_PHASES[i];
                    if (sec >= phase.min && sec < phase.max) {
                        currentText = phase.text;
                        break;
                    }
                }
                hintDom.innerText = currentText;
            }
            setInterval(updateHintByStay, 5000);

            // ============================================================
            // 粒子系统
            // ============================================================
            var canvas = document.getElementById('gs-particle-canvas');
            var ctx = canvas ? canvas.getContext('2d') : null;
            var particles = [];
            var mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

            function resizeCanvas() {
                if (!canvas) return;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function Particle() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.8 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = Math.random() * 1.5 + 0.3;
                var isPaper = Math.random() < 0.15;
                if (isPaper) {
                    this.isRed = false;
                    this.color = 'rgba(220, 200, 180, 0.25)';
                    this.sizeW = 2 + Math.random() * 6;
                    this.sizeH = 0.5 + Math.random() * 1.5;
                    this.rotation = Math.random() * Math.PI;
                } else {
                    this.isRed = Math.random() > 0.65;
                    this.color = this.isRed ? 'rgba(138, 3, 3, 0.9)' : 'rgba(60, 60, 70, 0.6)';
                    this.sizeW = this.size;
                    this.sizeH = this.size;
                    this.rotation = 0;
                }
                this.life = 1;
            }
            Particle.prototype.update = function() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.008) * 0.3;
                var dx = mouse.x - this.x;
                var dy = mouse.y - this.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    var force = (120 - dist) / 120;
                    this.x -= dx * force * 0.02;
                    this.y -= dy * force * 0.02;
                }
                if (this.y > canvas.height) {
                    this.y = -5;
                    this.x = Math.random() * canvas.width;
                    this.life = 1;
                }
                if (this.x > canvas.width || this.x < 0) this.x = Math.random() * canvas.width;
                this.life = Math.max(0.3, this.life - 0.0008);
                if (this.sizeW) this.rotation += 0.01;
            };
            Particle.prototype.draw = function() {
                ctx.globalAlpha = this.life * 0.8;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation || 0);
                if (this.sizeW) {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.sizeW / 2, -this.sizeH / 2, this.sizeW, this.sizeH);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                ctx.restore();
                ctx.globalAlpha = 1;
            };

            function initParticles() {
                particles = [];
                var count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
                for (var i = 0; i < count; i++) particles.push(new Particle());
            }

            function animateParticles() {
                if (!titleActive || !ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                animId = requestAnimationFrame(animateParticles);
            }

            document.addEventListener('mousemove', function(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                if (ghostSilhouette) {
                    var rect = ghostSilhouette.getBoundingClientRect();
                    var cx = rect.left + rect.width / 2;
                    var cy = rect.top + rect.height / 2;
                    var dist = Math.hypot(e.clientX - cx, e.clientY - cy);
                    document.body.style.cursor = (dist < 180) ? 'not-allowed' : 'crosshair';
                }
                idleTime = 0;
            });

            if (canvas && ctx) {
                resizeCanvas();
                initParticles();
                animateParticles();
                window.addEventListener('resize', function() { resizeCanvas();
                    initParticles(); });
            }

            // ============================================================
            // 脚印
            // ============================================================
            function spawnFootPrint() {
                if (!titleActive) return;
                var container = document.getElementById('foot-prints');
                if (!container) return;
                var foot = document.createElement('div');
                foot.className = 'foot-print';
                foot.style.left = (5 + Math.random() * 90) + '%';
                foot.style.animationDuration = (4 + Math.random() * 4) + 's';
                foot.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(foot);
                setTimeout(function() {
                    if (foot.parentNode) foot.remove();
                }, 8000);
            }
            setInterval(spawnFootPrint, 6000);

            // ============================================================
            // 碎片文字
            // ============================================================
            function showFragment() {
                if (!titleActive || isDispersing) return;
                if (!fragmentEl) return;
                var phrase = fragmentPhrases[Math.floor(Math.random() * fragmentPhrases.length)];
                fragmentEl.textContent = phrase;
                fragmentEl.classList.add('show');
                if (fragmentTimeout) clearTimeout(fragmentTimeout);
                fragmentTimeout = setTimeout(function() {
                    fragmentEl.classList.remove('show');
                }, 3000);
            }
            setInterval(function() {
                if (titleActive && menuStaySeconds > 10 && !isDispersing) {
                    showFragment();
                }
            }, 12000 + Math.random() * 8000);

            // ============================================================
            // 滴血
            // ============================================================
            function spawnBloodDrop() {
                if (!titleActive || isDispersing) return;
                if (!titleEl) return;
                var drop = document.createElement('span');
                drop.className = 'drop';
                var left = 10 + Math.random() * 80;
                var delay = Math.random() * 1.5;
                drop.style.cssText = 'left:' + left + '%;top:0;animation-delay:' + delay + 's;';
                titleEl.appendChild(drop);
                setTimeout(function() {
                    if (drop.parentNode) drop.remove();
                }, 3000 + delay * 1000);
            }
            dropInterval = setInterval(spawnBloodDrop, 5000);

            // ============================================================
            // 跳吓
            // ============================================================
            var enableScare = true;

            function triggerRandomScare() {
                if (!titleActive || isDispersing) return;
                if (!enableScare) return;
                var scareType = Math.random();
                var scareProb = Math.min(0.45, 0.1 + menuStaySeconds * 0.007);
                if (scareType > scareProb) return;
                var isIdle = idleTime > 8;
                var roll = Math.random();

                if (roll < 0.30 || (isIdle && roll < 0.50)) {
                    if (ghostFace) {
                        ghostFace.style.opacity = 0.75;
                        ghostFace.style.top = (10 + Math.random() * 30) + '%';
                        if (Math.random() > 0.5) {
                            ghostFace.style.left = (5 + Math.random() * 15) + 'vw';
                            ghostFace.style.right = 'auto';
                        } else {
                            ghostFace.style.right = (5 + Math.random() * 15) + 'vw';
                            ghostFace.style.left = 'auto';
                        }
                        setTimeout(function() { ghostFace.style.opacity = 0; }, 180 + Math.random() * 250);
                        playHeartbeat(0.22);
                        playNoiseBurst();
                    }
                } else if (roll < 0.65) {
                    if (flashbulb) {
                        flashbulb.style.transition = 'none';
                        flashbulb.style.opacity = '0.9';
                        setTimeout(function() { flashbulb.style.opacity = '0'; }, 60 + Math.random() * 80);
                        setTimeout(function() {
                            flashbulb.style.opacity = '0.7';
                            setTimeout(function() { flashbulb.style.opacity = '0'; }, 50);
                        }, 150);
                    }
                    if (ghostSilhouette) {
                        ghostSilhouette.style.left = (10 + Math.random() * 60) + 'vw';
                        ghostSilhouette.style.transform = 'scaleY(' + (1.1 + Math.random() * 0.6) + ') scaleX(' + (
                            Math.random() > 0.5 ? 1 : -1) + ')';
                        ghostSilhouette.classList.add('ghost-active');
                        setTimeout(function() { ghostSilhouette.classList.remove('ghost-active'); }, 400 + Math
                            .random() * 300);
                    }
                    playHeartbeat(0.25);
                    playNoiseBurst();
                } else if (roll < 0.85) {
                    if (subliminalText) {
                        subliminalText.innerText = scaryPhrases[Math.floor(Math.random() * scaryPhrases.length)];
                        subliminalText.style.opacity = '0.95';
                        subliminalText.style.transform = 'translate(-50%, -50%) scale(' + (1 + Math.random() * 0.8) +
                            ') skew(' + (Math.random() * 40 - 20) + 'deg)';
                        setTimeout(function() { subliminalText.style.opacity = '0'; }, 50 + Math.random() * 80);
                        playNoiseBurst();
                    }
                } else {
                    screen.classList.add('shaking');
                    if (bloodFlash) {
                        bloodFlash.classList.add('active');
                        setTimeout(function() { bloodFlash.classList.remove('active'); }, 200);
                    }
                    setTimeout(function() { screen.classList.remove('shaking'); }, 300);
                    playHeartbeat(0.3);
                    playNoiseBurst();
                }

                var baseDelay = 3000 + Math.random() * 9000;
                var adjustedDelay = Math.max(1500, baseDelay - menuStaySeconds * 30);
                scareTimer = setTimeout(triggerRandomScare, adjustedDelay);
            }

            // ============================================================
            // 乱码提示
            // ============================================================
            chaosInterval = setInterval(function() {
                if (!titleActive || isDispersing) return;
                var str = '';
                for (var i = 0; i < ORIGIN_HINT.length; i++) {
                    if (Math.random() > 0.85) {
                        str += chaosChars[Math.floor(Math.random() * chaosChars.length)];
                    } else {
                        str += ORIGIN_HINT[i];
                    }
                }
                hintDom.innerText = str;
                setTimeout(function() {
                    if (titleActive && !isDispersing) updateHintByStay();
                }, 5000);
            }, 4000);

            // ============================================================
            // 启动跳吓
            // ============================================================
            setTimeout(function() {
                if (titleActive) {
                    scareTimer = setTimeout(triggerRandomScare, 4500);
                }
            }, 1000);

            // ============================================================
            // 停止与清理
            // ============================================================
            function stopTitleScreen() {
                titleActive = false;
                if (animId) { cancelAnimationFrame(animId);
                    animId = null; }
                if (scareTimer) { clearTimeout(scareTimer);
                    scareTimer = null; }
                if (heartInterval) { clearTimeout(heartInterval);
                    heartInterval = null; }
                if (dropInterval) { clearInterval(dropInterval); }
                if (chaosInterval) { clearInterval(chaosInterval);
                    chaosInterval = null; }
                if (glowRAF) { cancelAnimationFrame(glowRAF);
                    glowRAF = null; }
                if (rainAudio) { rainAudio.pause();
                    rainAudio.currentTime = 0; }
                if (thunderAudio) { thunderAudio.pause();
                    thunderAudio.currentTime = 0; }
                if (audioCtx && audioCtx.state === 'running') {
                    try { audioCtx.close(); } catch (e) {}
                }
                window.removeEventListener('resize', resizeCanvas);
                if (titleEl) {
                    var drops = titleEl.querySelectorAll('.drop');
                    drops.forEach(function(d) { d.remove(); });
                }
                document.body.style.cursor = 'default';
                if (spotlightIdleTimer) clearTimeout(spotlightIdleTimer);
            }

            window.stopTitleStorm = stopTitleScreen;
            console.log('🎃 已加载：密钥验证 → 文字消散 → 名字注册（增强过渡动画版）');
            console.log('📛 保留名字列表:', RESERVED_NAMES);
            console.log('🔑 登录状态:', isLoggedIn() ? '已登录' : '未登录');
        })();
    </script>

</body>
</html>
