<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>龙弈</title>
    <style>
        /* ================= 基础 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body,
        html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Noto Serif SC', 'SimSun', 'Songti SC', serif;
            background-color: #000;
            cursor: crosshair;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* ================= 主菜单 ================= */
        #game-title-screen {
            --gs-blood-red: #8a0303;
            position: fixed;
            inset: 0;
            z-index: 100050;
            background-color: #050505;
            background-size: cover;
            background-position: center;
            color: #e0e0e0;
            user-select: none;
            overflow: hidden;
            transition: background-image 0.8s ease, background-position 0.1s ease;
            will-change: background-position, transform;
            animation: breathCamera 3.2s ease-in-out infinite alternate;
        }

        @keyframes breathCamera {
            0% {
                transform: translate(0px, 0px) rotate(0deg);
            }
            50% {
                transform: translate(1px, 1px) rotate(0.1deg);
            }
            100% {
                transform: translate(0px, 0px) rotate(0deg);
            }
        }

        /* ========== CRT烧屏残影 ========== */
        @keyframes burnIn {
            0% {
                opacity: 0;
            }
            30% {
                opacity: 0.12;
            }
            100% {
                opacity: 0;
            }
        }
        #burn-in-layer {
            position: absolute;
            inset: 0;
            z-index: 16;
            pointer-events: none;
            background: radial-gradient(circle at 30% 40%, rgba(200, 180, 150, 0.08) 0%, transparent 60%);
            animation: burnIn 8s ease-in-out infinite;
        }

        /* ========== 脚印残影 ========== */
        #foot-prints {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 6;
            pointer-events: none;
            opacity: 0.12;
            overflow: hidden;
            height: 40px;
        }
        .foot-print {
            position: absolute;
            bottom: 0;
            width: 12px;
            height: 20px;
            background: rgba(80, 70, 60, 0.3);
            border-radius: 50% 50% 30% 30%;
            opacity: 0;
            animation: footWalk 6s linear infinite;
        }
        @keyframes footWalk {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.6;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-120px) scale(0.8);
                opacity: 0;
            }
        }

        /* ========== 噪点 ========== */
        #gs-noise-layer {
            position: absolute;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
            animation: noiseFlicker 0.3s steps(3) infinite;
        }
        @keyframes noiseFlicker {
            0% {
                opacity: 0.12;
                transform: scale(1);
            }
            50% {
                opacity: 0.22;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.15;
                transform: scale(0.98);
            }
        }

        /* ========== 暗角 ========== */
        @keyframes vignettePulseTight {
            0% {
                background: radial-gradient(circle at center, transparent 22%, rgba(0, 0, 0, 0.75) 90%);
            }
            100% {
                background: radial-gradient(circle at center, transparent 12%, rgba(0, 0, 0, 0.88) 90%);
            }
        }
        #gs-vignette {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            animation: vignettePulseTight 5s ease-in-out infinite alternate;
        }

        /* ========== 扫描线 ========== */
        #gs-scanlines {
            position: absolute;
            inset: 0;
            z-index: 13;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0) 0px,
                    rgba(0, 0, 0, 0) 2px,
                    rgba(139, 0, 0, 0.08) 2px,
                    rgba(139, 0, 0, 0.08) 4px);
            animation: scanMove 6s linear infinite;
        }
        @keyframes scanMove {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100%);
            }
        }

        /* ========== 血光闪烁 ========== */
        #gs-blood-flash {
            position: absolute;
            inset: 0;
            z-index: 15;
            pointer-events: none;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(139, 0, 0, 0.35) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.1s;
            mix-blend-mode: multiply;
        }
        #gs-blood-flash.active {
            opacity: 1;
            transition: opacity 0s;
        }

        /* ========== 背景叠加 ========== */
        .gs-bg-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        /* ========== 粒子画布 ========== */
        #gs-particle-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.7;
            pointer-events: none;
        }

        /* ========== CRT扭曲 ========== */
        @keyframes crtDistort {
            0% {
                transform: skewX(0deg);
                filter: hue-rotate(0deg);
            }
            48% {
                transform: skewX(0deg);
            }
            50% {
                transform: skewX(1.5deg);
                filter: hue-rotate(8deg);
            }
            52% {
                transform: skewX(-1.5deg);
                filter: hue-rotate(-8deg);
            }
            100% {
                transform: skewX(0deg);
            }
        }
        .crt-distort {
            animation: crtDistort 8s infinite;
        }

        /* ========== 屏幕抖动 ========== */
        @keyframes screenShake {
            0% {
                transform: translate(0, 0);
            }
            10% {
                transform: translate(-4px, 4px);
            }
            20% {
                transform: translate(4px, -4px);
            }
            30% {
                transform: translate(-4px, -4px);
            }
            40% {
                transform: translate(4px, 4px);
            }
            50% {
                transform: translate(-2px, 2px);
            }
            60% {
                transform: translate(2px, -2px);
            }
            70% {
                transform: translate(-2px, -2px);
            }
            80% {
                transform: translate(2px, 2px);
            }
            90% {
                transform: translate(-1px, 1px);
            }
            100% {
                transform: translate(0, 0);
            }
        }
        .shaking {
            animation: screenShake 0.3s steps(2) !important;
        }

        /* ========== 滴血 ========== */
        @keyframes bloodDrip {
            0% {
                transform: translateY(0);
                opacity: 0.7;
            }
            100% {
                transform: translateY(60px);
                opacity: 0;
            }
        }
        .gs-glitch-title .drop {
            position: absolute;
            width: 3px;
            height: 12px;
            background: #8a0303;
            filter: blur(1px);
            animation: bloodDrip 2.5s infinite linear;
        }

        /* ========== 标题与按钮 ========== */
        .gs-title-container {
            position: relative;
            z-index: 20;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            animation: containerFloat 6s ease-in-out infinite;
        }
        @keyframes containerFloat {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .gs-glitch-title {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 1rem;
            position: relative;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(138, 3, 3, 0.8), 0 0 30px rgba(138, 3, 3, 0.5);
            animation: gs-pulse-red 4s infinite alternate;
            margin-bottom: 1rem;
            margin-left: 1rem;
        }
        .gs-glitch-title::before,
        .gs-glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
        }
        .gs-glitch-title::before {
            left: 3px;
            text-shadow: -2px 0 red;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            animation: gs-glitch-anim 2.5s infinite linear alternate-reverse;
        }
        .gs-glitch-title::after {
            left: -3px;
            text-shadow: -2px 0 blue;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            animation: gs-glitch-anim 3s infinite linear alternate-reverse;
        }
        @keyframes gs-glitch-anim {
            0% {
                clip-path: inset(20% 0 80% 0);
                transform: translate(-2px, 2px);
            }
            10% {
                clip-path: inset(50% 0 30% 0);
                transform: translate(2px, -2px);
            }
            20% {
                clip-path: inset(80% 0 5% 0);
                transform: translate(-2px, 2px);
            }
            30% {
                clip-path: inset(10% 0 60% 0);
                transform: translate(2px, -2px);
            }
            40% {
                clip-path: inset(30% 0 20% 0);
                transform: translate(-2px, 2px);
            }
            50% {
                clip-path: inset(90% 0 5% 0);
                transform: translate(2px, -2px);
            }
            60% {
                clip-path: inset(40% 0 40% 0);
                transform: translate(-2px, 2px);
            }
            70% {
                clip-path: inset(70% 0 10% 0);
                transform: translate(2px, -2px);
            }
            80% {
                clip-path: inset(10% 0 80% 0);
                transform: translate(-2px, 2px);
            }
            90% {
                clip-path: inset(60% 0 30% 0);
                transform: translate(2px, -2px);
            }
            100% {
                clip-path: inset(30% 0 50% 0);
                transform: translate(-2px, 2px);
            }
        }
        @keyframes gs-pulse-red {
            0% {
                text-shadow: 0 0 10px rgba(138, 3, 3, 0.4), 0 0 20px rgba(138, 3, 3, 0.2);
            }
            100% {
                text-shadow: 0 0 20px rgba(138, 3, 3, 1), 0 0 40px rgba(138, 3, 3, 0.6), 0 0 60px rgba(138, 3, 3, 0.4);
            }
        }

        .gs-subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.5rem);
            color: #888;
            letter-spacing: 0.5rem;
            margin-bottom: 4rem;
            opacity: 0.8;
            animation: gs-flicker 6s infinite;
        }
        @keyframes gs-flicker {
            0%,
            19.999%,
            22%,
            62.999%,
            64%,
            64.999%,
            70%,
            100% {
                opacity: 0.8;
            }
            20%,
            21.999%,
            63%,
            63.999%,
            65%,
            69.999% {
                opacity: 0.1;
                color: var(--gs-blood-red);
                text-shadow: 0 0 5px var(--gs-blood-red);
            }
        }

        .gs-menu-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }
        .gs-menu-btn {
            background: transparent;
            border: none;
            color: #aaaaaa;
            font-family: inherit;
            font-size: clamp(1.1rem, 3vw, 1.8rem);
            letter-spacing: 0.5rem;
            cursor: pointer;
            position: relative;
            padding: 0.5rem 2rem;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .gs-menu-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 2px;
            background-color: var(--gs-blood-red);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--gs-blood-red);
            z-index: -1;
        }
        .gs-menu-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 8px var(--gs-blood-red);
            transform: scale(1.05);
        }
        .gs-menu-btn:hover::before {
            width: 80%;
        }
        .gs-menu-btn.active {
            color: var(--gs-blood-red);
            text-shadow: 0 0 15px var(--gs-blood-red);
            animation: gs-heartbeat 1.5s infinite;
        }
        @keyframes gs-heartbeat {
            0% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.1);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ========== 幽灵剪影 ========== */
        .gs-ghost-silhouette {
            position: absolute;
            bottom: -5vh;
            left: 10vw;
            width: 50vw;
            height: 90vh;
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 20px #8a0303) blur(2px);
            transform: scaleY(1.2);
            transition: left 0.25s ease-out;
        }
        .gs-ghost-silhouette.ghost-active {
            opacity: 0.9;
            animation: gs-ghost-glitch 0.2s infinite alternate;
        }
        @keyframes gs-ghost-glitch {
            0% {
                transform: scaleY(1.2) translate(0, 0) skewX(0deg);
                filter: hue-rotate(0deg) blur(2px);
            }
            50% {
                transform: scaleY(1.2) translate(-30px, 15px) skewX(-20deg);
                filter: hue-rotate(90deg) blur(8px);
            }
            100% {
                transform: scaleY(1.2) translate(30px, -15px) skewX(15deg);
                filter: hue-rotate(-90deg) blur(1px);
            }
        }

        /* ========== 底部提示 ========== */
        .gs-heartbeat-hint {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 30;
            color: rgba(138, 3, 3, 0.5);
            font-size: 11px;
            letter-spacing: 0.4em;
            animation: hintPulse 2s ease-in-out infinite;
            pointer-events: none;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            transition: color 0.3s, text-shadow 0.3s;
        }
        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        /* ========== 鬼脸 ========== */
        #ghost-face {
            position: absolute;
            top: 15%;
            right: 8vw;
            width: 140px;
            height: 180px;
            opacity: 0;
            pointer-events: none;
            z-index: 14;
            filter: blur(4px) sepia(0.8);
            transition: opacity 0.15s ease;
        }
        #ghost-face svg {
            width: 100%;
            height: 100%;
        }

        /* ========== 划痕 ========== */
        #scratch-layer {
            position: absolute;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            opacity: 0.2;
            background-image: url('data:image/svg+xml,%3Csvg width="200" height="200" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M0 100 L200 95 M10 150 L180 130 M50 0 L70 200" stroke="%23444" stroke-width="0.7" opacity="0.4"/%3E%3C/svg%3E');
        }

        /* ========== 闪白 ========== */
        #gs-flashbulb {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: exclusion;
            transition: opacity 0.02s;
        }
        #gs-subliminal-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12vw;
            font-weight: 900;
            color: #8a0303;
            white-space: nowrap;
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            font-family: 'SimSun', serif;
            mix-blend-mode: color-dodge;
            transition: opacity 0.02s;
        }

        /* ========== 碎片文字 ========== */
        #fragment-text {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            color: rgba(180, 140, 120, 0.7);
            font-size: 14px;
            letter-spacing: 0.3em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(80, 20, 10, 0.5);
        }
        #fragment-text.show {
            opacity: 1;
        }

        /* ================================================================
                   ★ 灯光闪烁层
                   ================================================================ */
        @keyframes lampFlickerOverlay {
            0% {
                background: rgba(0, 0, 0, 0);
            }
            82% {
                background: rgba(0, 0, 0, 0);
            }
            84% {
                background: rgba(0, 0, 0, 0.28);
            }
            86% {
                background: rgba(0, 0, 0, 0.06);
            }
            88% {
                background: rgba(0, 0, 0, 0.35);
            }
            90% {
                background: rgba(0, 0, 0, 0.02);
            }
            92% {
                background: rgba(0, 0, 0, 0.20);
            }
            94% {
                background: rgba(0, 0, 0, 0);
            }
            100% {
                background: rgba(0, 0, 0, 0);
            }
        }
        #lamp-flicker-overlay {
            position: absolute;
            inset: 0;
            z-index: 11;
            pointer-events: none;
            background: rgba(0, 0, 0, 0);
            animation: lampFlickerOverlay 4.6s ease-in-out infinite;
            mix-blend-mode: multiply;
        }

        /* ================================================================
                   ★ 手电筒层
                   ================================================================ */
        #spotlight {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: radial-gradient(circle 350px at var(--sx, 50%) var(--sy, 50%),
                    transparent 0%,
                    rgba(0, 0, 0, 0.18) 18%,
                    rgba(0, 0, 0, 0.48) 38%,
                    rgba(0, 0, 0, 0.78) 58%,
                    rgba(0, 0, 0, 0.94) 78%,
                    rgba(0, 0, 0, 0.99) 100%);
            transition: background 0.06s ease-out;
            will-change: background;
        }
        #spotlight::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle 240px at var(--sx, 50%) var(--sy, 50%),
                    rgba(255, 220, 180, 0.04) 0%,
                    transparent 50%);
            pointer-events: none;
            mix-blend-mode: screen;
        }
        #spotlight.idle {
            background: radial-gradient(circle 350px at 50% 50%,
                    transparent 0%,
                    rgba(0, 0, 0, 0.28) 18%,
                    rgba(0, 0, 0, 0.58) 38%,
                    rgba(0, 0, 0, 0.85) 58%,
                    rgba(0, 0, 0, 0.97) 78%,
                    rgba(0, 0, 0, 0.99) 100%) !important;
        }
        #spotlight.idle::after {
            opacity: 0.3;
        }

        /* ================================================================
                   ★ 以"失"字为中心的光晕
                   ================================================================ */
        #char-glow {
            position: fixed;
            pointer-events: none;
            z-index: 3;
            width: 140px;
            height: 140px;
            margin-left: -70px;
            margin-top: -70px;
            background: radial-gradient(circle at center,
                    rgba(255, 230, 200, 0.04) 0%,
                    rgba(255, 200, 160, 0.02) 30%,
                    rgba(255, 180, 140, 0.006) 55%,
                    transparent 80%);
            mix-blend-mode: screen;
            will-change: transform, left, top;
            transition: none;
        }

        /* ================================================================
                   ★ 密钥验证弹窗
                   ================================================================ */
        #key-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0);
            visibility: hidden;
            opacity: 0;
            transition: background 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(0px);
        }
        #key-modal-overlay.active {
            background: rgba(0, 0, 0, 0.75);
            visibility: visible;
            opacity: 1;
            backdrop-filter: blur(6px);
        }
        #key-modal {
            width: min(400px, 100%);
            background: rgba(8, 6, 10, 0.96);
            border: 1px solid rgba(138, 3, 3, 0.5);
            border-radius: 8px;
            padding: 32px 28px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(138, 3, 3, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
            transform: scale(0.92) translateY(12px);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
        }
        #key-modal-overlay.active #key-modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        #key-modal::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(138, 3, 3, 0.08), transparent 70%);
            pointer-events: none;
        }
        .modal-title {
            font-size: 14px;
            font-weight: 600;
            color: #cc8a8a;
            letter-spacing: 0.3em;
            margin-bottom: 8px;
            font-family: 'Noto Serif SC', 'SimSun', serif;
        }
        .modal-sub {
            font-size: 11px;
            color: rgba(180, 140, 120, 0.6);
            letter-spacing: 0.12em;
            margin-bottom: 24px;
            font-family: 'Noto Serif SC', 'SimSun', serif;
        }
        .key-input-wrap {
            position: relative;
            border: 1px solid rgba(138, 3, 3, 0.3);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s;
        }
        .key-input-wrap:focus-within {
            border-color: rgba(138, 3, 3, 0.7);
            box-shadow: 0 0 20px rgba(138, 3, 3, 0.08);
        }
        .key-input-wrap input {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            outline: none;
            color: #e0d0c8;
            font-size: 15px;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 0.06em;
            text-align: center;
        }
        .key-input-wrap input::placeholder {
            color: rgba(180, 160, 150, 0.25);
            font-size: 12px;
            letter-spacing: 0.08em;
        }
        .key-error {
            min-height: 20px;
            margin-top: 12px;
            font-size: 11px;
            color: #cc5555;
            letter-spacing: 0.06em;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .key-error.show {
            opacity: 1;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .modal-btn {
            padding: 9px 24px;
            border: 1px solid rgba(138, 3, 3, 0.4);
            border-radius: 4px;
            background: transparent;
            color: #bbb;
            font-size: 12px;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.25s;
        }
        .modal-btn:hover {
            border-color: rgba(138, 3, 3, 0.7);
            color: #fff;
            background: rgba(138, 3, 3, 0.08);
        }
        .modal-btn.primary {
            border-color: rgba(138, 3, 3, 0.6);
            color: #ddb0b0;
        }
        .modal-btn.primary:hover {
            border-color: #8a0303;
            color: #fff;
            background: rgba(138, 3, 3, 0.15);
        }
        .modal-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #key-modal.flash-success {
            animation: keySuccessFlash 0.6s ease;
        }
        @keyframes keySuccessFlash {
            0% {
                background: rgba(138, 3, 3, 0.3);
            }
            100% {
                background: transparent;
            }
        }

        /* ================================================================
                   ★ 页面跳转过渡
                   ================================================================ */
        #page-transition {
            position: fixed;
            inset: 0;
            z-index: 300000;
            pointer-events: none;
            background: #050505;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.45s ease, visibility 0.45s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #page-transition.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        #page-transition .transition-content {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 0.3em;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            transform: scale(0.95);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
        }
        #page-transition.active .transition-content {
            transform: scale(1);
            opacity: 1;
        }
        #page-transition .transition-spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 16px;
            border: 2px solid rgba(138, 3, 3, 0.15);
            border-top-color: rgba(138, 3, 3, 0.6);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================================================================
                   ★ 黑色遮罩（文字消散时使用）
                   ================================================================ */
        #dark-shroud {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.8s ease;
        }
        #dark-shroud.active {
            opacity: 0.92;
            pointer-events: auto;
        }

        /* ================================================================
                   ★ 文字消散 - 字符样式
                   ================================================================ */
        .disperse-char {
            display: inline-block;
            transition: all 1.6s cubic-bezier(0.34, 1.0, 0.64, 1);
            transform: translate(0, 0) rotate(0deg) scale(1);
            filter: blur(0px);
            opacity: 1;
        }
        .disperse-char.fly {
            transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.05);
            opacity: 0;
            filter: blur(12px);
        }
        .disperse-done {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        /* ================================================================
                   ★ ★ ★ 名字注册弹窗 — 增强过渡动画 ★ ★ ★
                   ================================================================ */

        /* ---- 遮罩层：使用 visibility + opacity 实现平滑过渡 ---- */
        #name-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            visibility: hidden;
            opacity: 0;
            transition: background 0.6s ease, opacity 0.6s ease,
                visibility 0.6s ease, backdrop-filter 0.6s ease;
        }
        #name-modal-overlay.active {
            display: flex;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            visibility: visible;
            opacity: 1;
        }
        /* ---- 退出状态（用于取消/确认后淡出） ---- */
        #name-modal-overlay.exiting {
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: background 0.5s ease, opacity 0.5s ease,
                visibility 0.5s ease, backdrop-filter 0.5s ease;
        }

        /* ---- 弹窗主体：进入动画 ---- */
        #name-modal-box {
            width: min(400px, 100%);
            background: rgba(8, 6, 10, 0.96);
            border: 1px solid rgba(138, 3, 3, 0.4);
            border-radius: 8px;
            padding: 32px 28px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(138, 3, 3, 0.2),
                0 0 40px rgba(138, 3, 3, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            transform: translateY(40px) scale(0.92);
            opacity: 0;
            transition: transform 0.65s cubic-bezier(0.22, 1.2, 0.36, 1),
                opacity 0.55s ease,
                box-shadow 0.6s ease;
            backdrop-filter: blur(4px);
        }
        /* 弹窗进入后的状态 */
        #name-modal-overlay.active #name-modal-box {
            transform: translateY(0) scale(1);
            opacity: 1;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(138, 3, 3, 0.2),
                0 0 60px rgba(138, 3, 3, 0.15);
        }

        /* ---- 弹窗：红色光晕脉冲（进入后持续） ---- */
        #name-modal-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: radial-gradient(ellipse at 50% 30%,
                    rgba(138, 3, 3, 0.10),
                    transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: nameGlowPulse 3.2s ease-in-out infinite alternate;
        }
        @keyframes nameGlowPulse {
            0% {
                opacity: 0.4;
                transform: scale(0.98);
            }
            100% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* ---- 弹窗边框呼吸 ---- */
        #name-modal-box::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(138, 3, 3, 0.15),
                    rgba(138, 3, 3, 0.02),
                    rgba(138, 3, 3, 0.15));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
            animation: nameBorderPulse 3s ease-in-out infinite alternate;
        }
        @keyframes nameBorderPulse {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 0.9;
            }
        }

        /* ---- 弹窗内容层级 ---- */
        #name-modal-box>* {
            position: relative;
            z-index: 2;
        }

        /* ---- 标题：字符逐个浮现 ---- */
        .name-title {
            font-size: 15px;
            font-weight: 600;
            color: #cc8a8a;
            letter-spacing: 0.3em;
            margin-bottom: 8px;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            opacity: 0;
            animation: nameTitleReveal 0.8s ease forwards;
            animation-delay: 0.25s;
        }
        @keyframes nameTitleReveal {
            0% {
                opacity: 0;
                transform: translateY(-6px) scale(0.96);
                filter: blur(3px);
                text-shadow: 0 0 0 rgba(138, 3, 3, 0);
            }
            60% {
                opacity: 1;
                transform: translateY(2px) scale(1.01);
                filter: blur(0px);
                text-shadow: 0 0 20px rgba(138, 3, 3, 0.3);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
                text-shadow: 0 0 30px rgba(138, 3, 3, 0.15);
            }
        }
        /* 标题下的小字 */
        .name-sub {
            font-size: 11px;
            color: rgba(180, 140, 120, 0.6);
            letter-spacing: 0.12em;
            margin-bottom: 24px;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            opacity: 0;
            animation: nameSubReveal 0.7s ease forwards;
            animation-delay: 0.5s;
        }
        @keyframes nameSubReveal {
            0% {
                opacity: 0;
                transform: translateY(4px);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        /* ---- 输入框：从红色光晕中浮现 ---- */
        .name-input-wrap {
            position: relative;
            border: 1px solid rgba(138, 3, 3, 0.25);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            opacity: 0;
            transform: scale(0.94);
            animation: nameInputReveal 0.6s ease forwards;
            animation-delay: 0.6s;
            overflow: hidden;
        }
        @keyframes nameInputReveal {
            0% {
                opacity: 0;
                transform: scale(0.94);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }
        }
        .name-input-wrap:focus-within {
            border-color: rgba(138, 3, 3, 0.7);
            box-shadow: 0 0 30px rgba(138, 3, 3, 0.10), inset 0 0 20px rgba(138, 3, 3, 0.04);
        }
        .name-input-wrap input {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            outline: none;
            color: #e0d0c8;
            font-size: 16px;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            letter-spacing: 0.12em;
            text-align: center;
            transition: color 0.3s;
        }
        .name-input-wrap input::placeholder {
            color: rgba(180, 160, 150, 0.2);
            font-size: 13px;
            letter-spacing: 0.08em;
            transition: color 0.4s;
        }
        .name-input-wrap input:focus::placeholder {
            color: rgba(180, 160, 150, 0.05);
        }
        /* 输入框底部的血色下划线（聚焦时） */
        .name-input-wrap::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background: rgba(138, 3, 3, 0.5);
            transition: width 0.4s ease, left 0.4s ease;
            box-shadow: 0 0 12px rgba(138, 3, 3, 0.2);
        }
        .name-input-wrap:focus-within::after {
            width: 80%;
            left: 10%;
        }

        /* ---- 错误提示 ---- */
        .name-error {
            min-height: 20px;
            margin-top: 12px;
            font-size: 11px;
            color: #cc5555;
            letter-spacing: 0.06em;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.3s ease;
            transform: translateY(-4px);
        }
        .name-error.show {
            opacity: 1;
            transform: translateY(0);
            animation: nameErrorShake 0.4s ease;
        }
        @keyframes nameErrorShake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        /* ---- 按钮组：从下方滑入 ---- */
        .name-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(12px);
            animation: nameActionsReveal 0.6s ease forwards;
            animation-delay: 0.75s;
        }
        @keyframes nameActionsReveal {
            0% {
                opacity: 0;
                transform: translateY(12px);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        .name-btn {
            padding: 9px 28px;
            border: 1px solid rgba(138, 3, 3, 0.35);
            border-radius: 4px;
            background: transparent;
            color: #bbb;
            font-size: 12px;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .name-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(138, 3, 3, 0.05);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        .name-btn:hover::before {
            transform: scaleX(1);
        }
        .name-btn:hover {
            border-color: rgba(138, 3, 3, 0.7);
            color: #fff;
            background: rgba(138, 3, 3, 0.06);
        }
        .name-btn.primary {
            border-color: rgba(138, 3, 3, 0.5);
            color: #ddb0b0;
        }
        .name-btn.primary:hover {
            border-color: #8a0303;
            color: #fff;
            background: rgba(138, 3, 3, 0.12);
        }
        .name-btn:active {
            transform: scale(0.96);
        }

        /* ---- 退出动画：碎裂消散（取消时触发） ---- */
        #name-modal-box.shatter .name-title,
        #name-modal-box.shatter .name-sub,
        #name-modal-box.shatter .name-input-wrap,
        #name-modal-box.shatter .name-actions,
        #name-modal-box.shatter .name-error {
            animation: nameShatter 0.7s cubic-bezier(0.34, 1.0, 0.64, 1) forwards;
        }
        #name-modal-box.shatter .name-title {
            animation-delay: 0.0s;
        }
        #name-modal-box.shatter .name-sub {
            animation-delay: 0.08s;
        }
        #name-modal-box.shatter .name-input-wrap {
            animation-delay: 0.16s;
        }
        #name-modal-box.shatter .name-actions {
            animation-delay: 0.24s;
        }
        #name-modal-box.shatter .name-error {
            animation-delay: 0.10s;
        }
        @keyframes nameShatter {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
                filter: blur(0px);
            }
            40% {
                opacity: 0.8;
                transform: translate(var(--sx, 10px), var(--sy, -20px)) scale(0.8) rotate(var(--rot, 8deg));
                filter: blur(4px);
            }
            100% {
                opacity: 0;
                transform: translate(var(--sx, 40px), var(--sy, -60px)) scale(0.2) rotate(var(--rot, 25deg));
                filter: blur(16px);
            }
        }

        /* ---- 退出动画：血色消散（确认时触发） ---- */
        #name-modal-box.blood-exit {
            animation: bloodExit 0.55s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }
        @keyframes bloodExit {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                box-shadow: 0 0 60px rgba(138, 3, 3, 0.3);
            }
            30% {
                opacity: 1;
                transform: scale(1.03) translateY(-4px);
                box-shadow: 0 0 100px rgba(138, 3, 3, 0.6);
                border-color: rgba(138, 3, 3, 0.8);
            }
            100% {
                opacity: 0;
                transform: scale(0.6) translateY(50px);
                box-shadow: 0 0 0 rgba(138, 3, 3, 0);
                border-color: rgba(138, 3, 3, 0);
                filter: blur(8px);
            }
        }

        /* ---- 弹窗内部血色粒子（进入时短暂出现） ---- */
        #name-modal-box .blood-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(138, 3, 3, 0.3);
            pointer-events: none;
            z-index: 0;
            animation: bloodParticleRise 2.5s ease-out forwards;
        }
        @keyframes bloodParticleRise {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0);
            }
            20% {
                opacity: 0.6;
                transform: translateY(-10px) scale(1);
            }
            80% {
                opacity: 0.4;
                transform: translateY(-60px) scale(0.6);
            }
            100% {
                opacity: 0;
                transform: translateY(-90px) scale(0);
            }
        }

        /* ---- 遮罩额外闪烁（进入时） ---- */
        #name-modal-overlay.active::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(138, 3, 3, 0.04), transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: nameOverlayFlash 2s ease-out forwards;
        }
        @keyframes nameOverlayFlash {
            0% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ================= 主菜单容器 ================= -->
    <div id="game-title-screen" class="crt-distort">

                <ellipse cx="45" cy="45" rx="4" ry="6" fill="#8a0303" filter="blur(1px)"/>

                <button type="button" class="modal-btn primary" id="key-modal-confirm">验证</button>
            </div>

    </div>

    <!-- ★ ★ ★ 名字注册弹窗 — 增强过渡动画版 ★ ★ ★ -->
    <div id="name-modal-overlay">
        <div id="name-modal-box">
            <div class="name-title">✦ 留下你的名字 ✦</div>
            <div class="name-sub">它将铭刻于轮回之中</div>
            <div class="name-input-wrap">
                <input type="text" id="name-input" placeholder="输入你的名字..." autocomplete="off" maxlength="20">

                <button type="button" class="name-btn" id="name-cancel">返回</button>

    <!-- ================================================================
    JAVASCRIPT
    ================================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 可配置参数
            // ============================================================

            // ============================================================
            // 音频初始化
            // ============================================================
            function initHorrorAudio() {
                if (isAudioReady) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    droneOsc = audioCtx.createOscillator();
                    droneGain = audioCtx.createGain();
                    var filter = audioCtx.createBiquadFilter();
                    droneOsc.type = 'sawtooth';
                    droneOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
                    droneOsc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 8);
                    filter.type = 'lowpass';
                    filter.frequency.value = 120;
                    filter.Q.value = 0.5;
                    droneGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                    droneGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 1.5);
                    droneGain.gain.setValueAtTime(0.04, audioCtx.currentTime + 5);
                    droneGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 12);
                    droneOsc.connect(filter);
                    filter.connect(droneGain);
                    droneGain.connect(audioCtx.destination);
                    droneOsc.start(audioCtx.currentTime);
                    droneOsc.stop(audioCtx.currentTime + 13);

                    setTimeout(function() {
                        if (audioCtx && audioCtx.state === 'running') {
                            if (Math.random() < 0.08 && droneOsc) {
                                droneOsc.frequency.exponentialRampToValueAtTime(32, audioCtx.currentTime + 0.3);
                            }
                            initHorrorAudio();
                        }
                    }, 14000);

                    function playWhisper() {
                        if (!audioCtx || audioCtx.state !== 'running') return;
                        try {
                            var now = audioCtx.currentTime;
                            var bufferSize = audioCtx.sampleRate * 1.5;
                            var buf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                            var data = buf.getChannelData(0);
                            for (var i = 0; i < bufferSize; i++) {
                                var env = Math.sin(i / bufferSize * Math.PI) * 0.15;
                                data[i] = (Math.random() * 2 - 1) * env * 0.12;
                            }
                            var src = audioCtx.createBufferSource();
                            src.buffer = buf;
                            var gain = audioCtx.createGain();
                            gain.gain.setValueAtTime(0.0001, now);
                            gain.gain.linearRampToValueAtTime(0.015, now + 0.3);
                            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
                            var filter2 = audioCtx.createBiquadFilter();
                            filter2.type = 'bandpass';
                            filter2.frequency.value = 800 + Math.random() * 400;
                            filter2.Q.value = 0.6;
                            src.connect(filter2);
                            filter2.connect(gain);
                            gain.connect(audioCtx.destination);
                            src.start(now);
                            src.stop(now + 2);
                            if (Math.random() < 0.3) {
                                setTimeout(function() {
                                    if (!audioCtx) return;
                                    var footNow = audioCtx.currentTime;
                                    var footBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate *
                                        0.1), audioCtx.sampleRate);
                                    var footData = footBuf.getChannelData(0);
                                    for (var j = 0; j < footData.length; j++) {
                                        footData[j] = (Math.random() * 2 - 1) * 0.08;
                                    }
                                    var footSrc = audioCtx.createBufferSource();
                                    footSrc.buffer = footBuf;
                                    var fGain = audioCtx.createGain();
                                    fGain.gain.setValueAtTime(0.0001, footNow);
                                    fGain.gain.linearRampToValueAtTime(0.012, footNow + 0.02);
                                    fGain.gain.exponentialRampToValueAtTime(0.0001, footNow + 0.12);
                                    var fFilter = audioCtx.createBiquadFilter();
                                    fFilter.type = 'lowpass';
                                    fFilter.frequency.value = 120;
                                    footSrc.connect(fFilter);
                                    fFilter.connect(fGain);
                                    fGain.connect(audioCtx.destination);
                                    footSrc.start(footNow);
                                    footSrc.stop(footNow + 0.14);
                                }, 300 + Math.random() * 600);
                            }
                        } catch (e) {}
                    }
                    setInterval(function() {

            function playHeartbeat(volume) {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    var now = audioCtx.currentTime;
                    var osc1 = audioCtx.createOscillator();
                    var gain1 = audioCtx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(68, now);
                    osc1.frequency.exponentialRampToValueAtTime(42, now + 0.15);
                    gain1.gain.setValueAtTime(0.0001, now);
                    gain1.gain.linearRampToValueAtTime(volume || 0.15, now + 0.02);
                    gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.22);
                    var osc2 = audioCtx.createOscillator();
                    var gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(52, now + 0.25);
                    osc2.frequency.exponentialRampToValueAtTime(38, now + 0.4);
                    gain2.gain.setValueAtTime(0.0001, now + 0.25);
                    gain2.gain.linearRampToValueAtTime((volume || 0.12) * 0.8, now + 0.27);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(now + 0.25);
                    osc2.stop(now + 0.47);
                    if (bloodFlash) {
                        bloodFlash.classList.add('active');
                        setTimeout(function() { bloodFlash.classList.remove('active'); }, 150);
                        setTimeout(function() {
                            bloodFlash.classList.add('active');
                            setTimeout(function() { bloodFlash.classList.remove('active'); }, 120);
                        }, 280);
                    }
                } catch (e) {}
            }

            function scheduleRandomHeartbeat(delay) {
                if (heartInterval) clearTimeout(heartInterval);
                var nextDelay = 3000 + Math.random() * 8000;
                heartInterval = setTimeout(function() {
                    if (audioCtx && audioCtx.state === 'running') {
                        if (Math.random() > 0.2) {
                            playHeartbeat(0.12 + Math.random() * 0.08);
                        }
                        scheduleRandomHeartbeat(0);
                    }
                }, delay || nextDelay);
            }

                    for (var i = 0; i < bufferSize; i++) {

                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                    noise.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start();
                } catch (e) {}
            }

            // ============================================================

            // ============================================================
            function updateGlowPosition() {
                if (!titleActive) return;
                var range = document.createRange();
                var textNode = null;
                var walker = document.createTreeWalker(
                    titleEl,
                    NodeFilter.SHOW_TEXT, {
                        acceptNode: function(node) {
                            if (node.textContent.indexOf('失') !== -1) {
                                return NodeFilter.FILTER_ACCEPT;
                            }
                            return NodeFilter.FILTER_REJECT;
                        }
                    }
                );
                var node = walker.nextNode();
                if (node) {
                    var index = node.textContent.indexOf('失');
                    range.setStart(node, index);
                    range.setEnd(node, index + 1);
                    var rect = range.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        var cx = rect.left + rect.width / 2;
                        var cy = rect.top + rect.height / 2;
                        charGlow.style.left = cx + 'px';
                        charGlow.style.top = cy + 'px';
                    }
                }
            }

            function updateGlowPositionLoop() {
                if (!titleActive) {
                    glowRAF = null;
                    return;

            // ============================================================
            // ★ 核心：文字逐个分离消散
            // ============================================================
            function startDispersion() {
                if (isDispersing) return;
                isDispersing = true;
                window.__GAME_STARTED = true;

                darkShroud.classList.add('active');

                var elements = [
                    { el: titleEl, text: '龙弈' },
                    { el: subtitleEl, text: '仙偶工作室' },
                    { el: btnStart, text: '开始游戏' },
                    { el: hintDom, text: '✦ 你感觉到视线了吗 ✦' }
                ];

                var allChars = [];
                var totalDelay = 0;

                elements.forEach(function(item) {
                    var el = item.el;
                    var text = item.text;
                    if (!text || text.length === 0) return;

                    var parent = el.parentNode;
                    var container = document.createElement('span');
                    container.style.cssText = 'display:inline-block;position:relative;';
                    container.className = 'disperse-container';

                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';

                    for (var i = 0; i < text.length; i++) {
                        var ch = text[i];
                        var charSpan = document.createElement('span');
                        charSpan.className = 'disperse-char';
                        charSpan.textContent = ch;
                        var delay = 0.25 + Math.random() * 0.25;
                        charSpan.style.transitionDelay = (totalDelay + delay) + 's';
                        var angle = Math.random() * 360;
                        var distance = 80 + Math.random() * 200;
                        var tx = Math.cos(angle * Math.PI / 180) * distance;
                        var ty = Math.sin(angle * Math.PI / 180) * distance - 60;
                        var rot = (Math.random() * 720 - 360) + 'deg';
                        charSpan.dataset.tx = tx;
                        charSpan.dataset.ty = ty;
                        charSpan.dataset.rot = rot;
                        container.appendChild(charSpan);
                        allChars.push(charSpan);
                        totalDelay += 0.2;
                    }

                    parent.insertBefore(container, el);
                });

                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        allChars.forEach(function(ch) {
                            var tx = parseFloat(ch.dataset.tx) || 0;
                            var ty = parseFloat(ch.dataset.ty) || 0;
                            var rot = ch.dataset.rot || '0deg';
                            ch.style.setProperty('--tx', tx + 'px');
                            ch.style.setProperty('--ty', ty + 'px');
                            ch.style.setProperty('--rot', rot);
                            ch.classList.add('fly');
                        });
                    });
                });

                var maxDelay = totalDelay + 1.8;
                setTimeout(function() {
                    document.querySelectorAll('.disperse-container').forEach(function(c) {
                        c.style.opacity = '0';
                        c.style.pointerEvents = 'none';
                    });
                    showNameInputForce();
                }, maxDelay * 1000 + 300);
            }

            // ============================================================

            // ============================================================
            function showNameInputForce() {
                if (nameModalShown) return;
                nameModalShown = true;
                isExitingNameModal = false;

                nameBox.classList.remove('shatter', 'blood-exit');
